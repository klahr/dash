# Your first task on the board: create a task, queue it, watch it run,
# read the diff and merge it. About a minute. See README.md for the format.
title: Your first task on the board
next: "Goals: let Claude plan the work"
seed: first-task   # seed.mjs's scene: two tasks done, two drafts

steps:
  - say: >
      This is Dash. Every task in a project is a card on this board, and
      moves from left to right: from a draft, through the queue and review,
      until it's merged.
    do:
      - hover: "#board [data-lane=draft] .col-label"
      - pause: 1.5
      - hover: "#board [data-lane=done] .col-label"

  - say: >
      Press New task, and describe the change you want in plain words, the
      way you would ask a colleague.
    do:
      - click: "#new-todo"
      - type: Tell shoppers how much more they need to spend for free shipping.
        into: "#quick-rows .quick-row"
        cps: 34

  - say: Save it as a draft. Claude reads it and gives the task a short name.
    do:
      - click: "#quick-form button[value=draft]"
      - wait: "#board .todo.s-draft"
        text: Free-shipping

  - say: Open it, and when it looks right, press Queue. Claude starts working on it.
    do:
      - click: .todo-open
        in: "#board .todo"
        text: Free-shipping
      - click: "#d-actions .btn.primary"
        text: Queue
      - wait: "#board .todo.s-in_progress, #board .todo.s-queued"
        text: Free-shipping

  - say: >
      Follow along in the task. Every file Claude reads, every edit and
      every test run shows up in its timeline.
    do:
      - pause: 2

  - say: >
      Claude works on its own copy of the code, so your main branch stays
      untouched until you approve.
    do:
      - wait: "#board .todo.s-review"
        text: Free-shipping
        timeout: 120

  - say: Ready for review, and the tests pass. Open Changes to read the diff.
    do:
      - click: ".pane-tabs button[data-pane=diff]"
      - click: "#d-diff details.diff-file summary"
        text: checkout.js
      - pause: 1

  - say: Looks good. Approve it, and Dash merges it into main as one commit.
    do:
      - click: .detail button.review
        text: Approve
      - wait: "#board .todo.s-merged"
        text: Free-shipping
        timeout: 60

  - say: >
      That's your first task: from an idea to merged code, without leaving
      the board.
    do:
      - click: "#d-close"
      - hover: "#board .todo.s-merged"
        text: Free-shipping
