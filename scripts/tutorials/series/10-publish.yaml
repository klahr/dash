# 10 · Publish the game. An environment with a deploy command, a release
# tag, and a deploy, ending on the game live at its link.
# Seed "game-done": touch controls and deploy.sh merged. deploy.sh copies the
# game to $SITE_DIR, which site-server.mjs serves as star-catcher.r8.rs.
title: Publish the game
seed: game-done

steps:
  - say: >
      The game is ready to share. To put it online, tell Dash how to deploy
      it: open History, then Deploys, and press Settings.
    do:
      - click: ".menu-view[data-view=history]"
      - click: "#view-history .page-tabs button[data-tab=deploys]"
      - click: "#deploy-settings"

  - say: >
      Add an environment. The deploy command is your own script: here it
      copies the game to a static host. Add the URL where it will be.
    do:
      - click: "#settings-env-add"
      - type: ./deploy.sh
        into: "#settings-envs .env-edit textarea.script-field"
      - type: http://star-catcher.r8.rs
        into: "#settings-envs .env-edit input[type=url]"
      - key: Enter
      - click: "#settings-form button[value=cancel]"
      # The page doesn't show a new environment until it is opened again.
      - click: "#view-deploys .page-tabs button[data-tab=history]"
      - click: "#view-history .page-tabs button[data-tab=deploys]"
      - wait: "#env-cards .env-card[data-env=production]"

  - say: >
      Deploys go out as releases. Press Deploy: there's no release yet, so
      Dash offers a new one from main. Keep the version it suggests, and
      press Tag and deploy.
    do:
      - click: "#env-cards .env-card[data-env=production] .env-deploy"
      - wait: "dialog[open] button[value=ok]:not([disabled])"
        text: and deploy
        timeout: 60
      - pause: 1
      - click: "dialog[open] button[value=ok]"
        text: and deploy

  - say: >
      Deploys to production wait for an admin's approval. That's you here:
      press Approve, and confirm.
    do:
      - click: "#env-cards .env-card button"
        text: Approve
      - click: "dialog[open] button[value=ok]"
        text: Approve

  - say: >
      Dash runs your script on the runner, checks that the site answers, and
      marks it Live.
    do:
      - wait: "#env-cards .env-live"
        timeout: 120
      - hover: "#env-cards .env-url"

  - say: >
      And there it is: Star Catcher, from an idea to a game anyone can play.
      Thanks for building it with us.
    do:
      - open: https://star-catcher.r8.rs
      - pause: 1
      - key: ArrowRight
      - pause: 2
