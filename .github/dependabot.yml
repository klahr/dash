# Weekly update pull requests, grouped per ecosystem so each week brings at
# most one PR for each.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-modules:
        patterns: ["*"]

  # The workflows pin actions by commit SHA with the version in a comment;
  # Dependabot updates both.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  # Dockerfile (the hub from source), deploy/Dockerfile.release (the release
  # image) and deploy/caddy/Dockerfile. All pin their base images by digest
  # (CI checks), so Dependabot also bumps floating tags such as distroless
  # :nonroot and busybox:stable, updating tag and digest together. The golang
  # tag must match go.mod's go line (CI checks), so bump both in one change.
  - package-ecosystem: docker
    directories:
      - /
      - /deploy
      - /deploy/caddy
    schedule:
      interval: weekly
    groups:
      docker-images:
        patterns: ["*"]
