name: Release

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+*"] # X.Y.Z, e.g. 1.2.0 or 1.2.0-rc.1

permissions:
  contents: write # create the GitHub release and upload its files
  packages: write # push the hub image to ghcr.io/<owner>/dash

jobs:
  # All of CI (tests, vet, staticcheck, govulncheck, the image builds) must
  # pass on the tagged commit before anything is published.
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  goreleaser:
    name: GoReleaser
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the changelog needs the previous tag

      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod

      # The hub image (dockers_v2 in .goreleaser.yaml): multi-arch through buildx.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          # Exact GoReleaser version, the same in ci.yml and release.yml. Dependabot
          # doesn't update this input: bump it by hand in both files.
          version: v2.20.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
