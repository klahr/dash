name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call: # the release workflow runs all of CI first

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Formatting, tidiness, vet, staticcheck, govulncheck, the build and the
  # JavaScript syntax check. No tests, so no Chrome.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Caching is done below, one cache per job: with setup-go's own cache
      # every job would share one key and the first to finish would win.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-lint-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-lint-

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: Check go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Vet
        run: go vet ./...

      # Pinned by version (go.sum's checksum database checks the download);
      # bump these by hand. staticcheck must be built with the Go in go.mod.
      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...

      # Fails only on vulnerabilities the code can reach, not on every
      # vulnerable module in go.sum.
      - name: Govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

      - name: Build
        run: go build ./...

      - name: Check JavaScript syntax
        run: for f in web/static/*.js web/static/app/*.js; do node --check "$f"; done

      # Also run by go test, but here they can't skip for want of node.
      # importcheck_test.mjs fails on a name used but never imported.
      - name: JavaScript tests
        run: node --test web/*_test.mjs

  # The tests are CPU-bound, so they are split across runners rather than
  # run with more t.Parallel(): the two slowest packages get a job each, and
  # "other" runs every remaining package.
  test:
    name: Test (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: internal/api
            pkg: ./internal/api
          # Includes the browser tests (cmd/dash/browser_test.go) in the
          # runner's preinstalled Google Chrome.
          - name: cmd/dash
            pkg: ./cmd/dash
          - name: other
            pkg: other
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-test-${{ strategy.job-index }}-${{ hashFiles('go.sum') }}
          restore-keys: go-${{ runner.os }}-test-${{ strategy.job-index }}-

      # "other" is every package from go list minus the ones with a job of
      # their own, so a new package is never left out. Keep the go list
      # below in step with the matrix's pkg values.
      - name: Test
        env:
          # The browser tests are required here, so they can't skip.
          DASH_TEST_BROWSER: require
          PKG: ${{ matrix.pkg }}
        run: |
          if [ "$PKG" != other ]; then
            go test -race "$PKG"
            exit
          fi
          own=$(go list ./internal/api ./cmd/dash)
          pkgs=$(go list ./... | grep -vxF "$own")
          echo "Testing:"; echo "$pkgs"
          go test -race $pkgs

  # One check for branch protection that passes only when lint and every
  # test job passed. Named Go, as the single job before the split was, so
  # the required "Go" check keeps working. always(): a job skipped because
  # what it needs failed counts as passed for a required check.
  go:
    name: Go
    needs: [lint, test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Lint and all tests passed
        env:
          LINT: ${{ needs.lint.result }}
          TEST: ${{ needs.test.result }}
        run: |
          echo "lint: $LINT, test: $TEST"
          [ "$LINT" = success ] && [ "$TEST" = success ]

  goreleaser:
    name: GoReleaser config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          # Exact GoReleaser version, the same in ci.yml and release.yml. Dependabot
          # doesn't update this input: bump it by hand in both files.
          version: v2.20.3
          args: check

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dockerfile's Go version matches go.mod
        run: |
          want=$(awk '$1 == "go" { print $2 }' go.mod)
          got=$(sed -n 's/^FROM .*golang:\([0-9.]*\)-alpine@sha256:.*/\1/p' Dockerfile)
          if [ "$want" != "$got" ]; then
            echo "Dockerfile has golang:$got, go.mod has go $want"
            exit 1
          fi

      - name: Base images are pinned by digest
        run: |
          if grep -n '^FROM ' Dockerfile deploy/Dockerfile.release deploy/caddy/Dockerfile | grep -v '@sha256:[0-9a-f]\{64\}'; then
            echo "Pin these base images by digest (name:tag@sha256:...)"
            exit 1
          fi

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Built, never pushed.
      - name: Build the hub image
        run: docker buildx build --load --build-arg VERSION=ci -t dash:ci .

      - name: Smoke test
        run: |
          docker run --rm dash:ci version | grep -qx 'dash ci'
          docker run -d --name dash -e DASH_USERNAME=admin -e DASH_PASSWORD=ci-password-1234 dash:ci
          for i in $(seq 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' dash)" = healthy ] && break
            docker exec dash /usr/local/bin/dash healthcheck && break
            sleep 2
          done
          docker exec dash /usr/local/bin/dash healthcheck
          docker logs dash
          docker rm -f dash

      - name: Compose file is valid
        working-directory: deploy
        run: |
          cp docker.env.example .env
          docker compose config --quiet
          printf 'COMPOSE_FILE=docker-compose.yml:docker-compose.dns.yml\nCADDY_DNS_PROVIDER=cloudflare\nDASH_PREVIEW_DOMAIN=preview.dash.example.com\nDASH_ORG_DOMAIN=dash.example.com\n' >> .env
          docker compose config --quiet

      - name: Caddyfile is valid
        working-directory: deploy/caddy
        run: |
          docker run --rm -v "$PWD:/etc/caddy:ro" -e DASH_DOMAIN=dash.example.com -e ACME_EMAIL=you@example.com \
            caddy:2.11.9@sha256:4851e54a46b206517c574821bb5cc67f170d2156041e9fbc4c9193b45e84a75b caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      # The release image (deploy/Dockerfile.release), as GoReleaser builds it
      # on a tag, without pushing.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          # Exact GoReleaser version, the same in ci.yml and release.yml. Dependabot
          # doesn't update this input: bump it by hand in both files.
          version: v2.20.3
          args: release --snapshot --clean
