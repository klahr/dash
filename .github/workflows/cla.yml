name: CLA

# Asks each pull request's author to sign CLA.md by comment and records the
# signatures in signatures/cla.json on the cla-signatures branch.
#
# pull_request_target runs with this repository's token even for pull requests
# from forks, which the action needs to comment and to write signatures. It
# never checks out the pull request's code, so that code never runs here.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened, closed]

permissions:
  actions: write
  contents: write # write signatures to the cla-signatures branch
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: CLA
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
       (github.event.comment.body == 'recheck' ||
        github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      # The action writes signatures to the branch but doesn't create it, and
      # fails without it: make it from the default branch the first time.
      - name: Create the cla-signatures branch if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if gh api "repos/$REPO/branches/cla-signatures" --silent 2>/dev/null; then
            exit 0
          fi
          sha=$(gh api "repos/$REPO/git/ref/heads/$DEFAULT_BRANCH" --jq .object.sha)
          # Another run may create it at the same moment: that's fine too.
          gh api "repos/$REPO/git/refs" -f ref=refs/heads/cla-signatures -f sha="$sha" --silent \
            || gh api "repos/$REPO/branches/cla-signatures" --silent
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/${{ github.repository }}/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          # A branch of its own, so signing never needs a commit on a protected main.
          branch: cla-signatures
          # The repository owner and bots don't sign.
          allowlist: ${{ github.repository_owner }},*[bot]
          lock-pullrequest-aftermerge: false
          custom-notsigned-prcomment: >-
            Thanks for your pull request! Before it can be merged, please read the
            [Contributor License Agreement](https://github.com/${{ github.repository }}/blob/main/CLA.md)
            and sign it by replying with the comment below. You keep the copyright in your
            work; the CLA lets the project offer Dash under other licenses besides AGPL-3.0.
            You only sign once.
          custom-allsigned-prcomment: All contributors have signed the CLA. Thank you!
