<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101722">
  <meta name="color-scheme" content="dark">
  <meta name="referrer" content="no-referrer">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <title>Invitation · {{DASH_NAME}}</title>
  <meta name="dash-name" content="{{DASH_NAME}}">
  <link rel="stylesheet" href="/vendor/fonts/fonts.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="login-page">
    <div class="login-card invite-card">
      <div class="brand">
        <img src="{{DASH_LOGO}}" alt="" aria-hidden="true">
        <span>{{DASH_NAME}}</span>
      </div>
      <p class="invite-what" id="invite-what">Checking the invitation…</p>

      <!-- Signed in on this browser: accept as that account -->
      <div id="invite-signed-in" hidden>
        <button class="btn primary" id="invite-accept" type="button">Accept</button>
        <p class="login-alt">Not you? <button type="button" class="link inline" id="invite-signout">Sign out</button> to use another account.</p>
      </div>

      <!-- Not signed in: a new account, or sign in to an existing one -->
      <form id="invite-register" hidden>
        <label class="field"><span>Choose a username</span><input name="username" autocomplete="username" autocapitalize="none" required maxlength="64"></label>
        <label class="field"><span>Choose a password <em>at least 8 characters</em></span><input name="password" type="password" autocomplete="new-password" required minlength="8"></label>
        <button class="btn primary">Create account and join</button>
        <div class="google-area" id="invite-google" hidden>
          <div class="login-or"><span>or</span></div>
          <button class="btn google-btn" type="button" id="invite-google-btn"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21.6 12.2c0-.7-.1-1.4-.2-2H12v3.8h5.4a4.6 4.6 0 0 1-2 3v2.5h3.2c1.9-1.7 3-4.3 3-7.3Z" fill="#4285F4"/><path d="M12 22c2.7 0 5-.9 6.6-2.4l-3.2-2.5c-.9.6-2 1-3.4 1-2.6 0-4.8-1.8-5.6-4.1H3.1v2.6A10 10 0 0 0 12 22Z" fill="#34A853"/><path d="M6.4 14c-.2-.6-.3-1.3-.3-2s.1-1.4.3-2V7.4H3.1a10 10 0 0 0 0 9.2L6.4 14Z" fill="#FBBC05"/><path d="M12 6c1.5 0 2.8.5 3.8 1.5l2.9-2.9A10 10 0 0 0 3.1 7.4L6.4 10C7.2 7.7 9.4 6 12 6Z" fill="#EA4335"/></svg>Join with Google</button>
          <p class="login-alt" id="invite-google-hint"></p>
        </div>
        <p class="login-alt">Already have a {{DASH_NAME}} account? <a href="/login.html" id="invite-login">Sign in</a> and come back to this link.</p>
      </form>

      <button class="btn secondary-action" id="invite-decline" type="button" hidden>Decline</button>
      <div id="invite-error" class="login-error" role="alert"></div>
    </div>
    <!--DASH_FOOTER-->
  </main>
  <script src="invite.js"></script>
</body>
</html>
