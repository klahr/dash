<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101722">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <title>Sign in · Dash</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="login-page">
    <form id="login" class="login-card">
      <img class="login-art" src="img/login-art.webp" alt="" width="640" height="400" onerror="this.remove()">
      <div class="brand">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3v10.5a4.5 4.5 0 0 0 4.5 4.5H18M6 7h6M18 18l-3-3m3 3-3 3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6" cy="3" r="1.6" fill="currentColor"/></svg>
        <span>Dash</span>
      </div>
      <p>Sign in to manage your agents.</p>
      <label class="field"><span>Username</span><input name="username" autocomplete="username" autocapitalize="none" required autofocus></label>
      <label class="field"><span>Password</span><input name="password" type="password" autocomplete="current-password" required></label>
      <button class="btn primary">Sign in</button>
      <div id="login-error" class="login-error" role="alert"></div>
    </form>
  </main>
  <script src="login.js"></script>
</body>
</html>
