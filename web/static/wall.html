<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>{{DASH_NAME}} · Wall</title>
<link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="/vendor/fonts/fonts.css">
<style>
  :root{
    /* Same palette as the app (style.css :root), under the wall's short names. */
    color-scheme:dark;
    /* --dim and --faint are lighter than the app's: read across a room, on a
       TV, they keep a contrast of at least 6:1 on the cards (--raised). */
    --bg:#101722; --panel:#172131; --raised:#1f2b3e; --line:#2a384d; --text:#e6ecf5; --dim:#a7b5c9; --faint:#9aa9bf;
    --queue:#8aa4ff; --run:#f2b84b; --rev:#5ec8e5; --ok:#6fd39a; --bad:#ff7a7a;
    --merge:var(--ok); /* merging is green on the board too (style.css .s-merging) */
    --st:var(--ok); /* the overall status's colour (html.lvl-…) */
  }
  html.lvl-warn{--st:var(--run)}
  html.lvl-bad{--st:var(--bad)}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);overflow:hidden;height:100%;cursor:none}
  .tv{width:1920px;height:1080px;background:var(--bg);color:var(--text);position:absolute;left:0;top:0;transform-origin:0 0;
      font:500 22px/1.3 "Instrument Sans","Inter","Segoe UI",system-ui,sans-serif;
      display:grid;grid-template-rows:96px 60px minmax(0,1fr);gap:20px;padding:28px 36px;overflow:hidden}
  /* The overall status as an edge around the whole screen: thin when all is
     good, thick when it isn't. The header says it in words and a symbol. */
  .tv::after{content:"";position:absolute;inset:0;border:4px solid color-mix(in srgb,var(--st) 45%,transparent);pointer-events:none;z-index:3}
  .lvl-warn .tv::after,.lvl-bad .tv::after{border-width:10px;border-color:var(--st)}
  .num{font-variant-numeric:tabular-nums}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px 26px;min-height:0;overflow:hidden}
  h2{font-size:20px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-bottom:16px;display:flex;align-items:center;gap:12px}
  h2 .count{color:var(--text);letter-spacing:0;font-size:22px}
  h2.sub{margin:0 0 6px}
  .empty{color:var(--faint);font-size:22px;padding:8px 0}

  /* header */
  header{display:flex;align-items:center;gap:36px;min-width:0}
  .brand{font-size:32px;font-weight:700;letter-spacing:-.02em;white-space:nowrap;flex:none}
  .brand small{font-size:20px;color:var(--dim);font-weight:500;margin-left:12px}
  /* The overall status, the biggest words on the wall: symbol, word, counts. */
  .status{display:flex;align-items:center;gap:16px;font-size:34px;font-weight:700;color:var(--st);min-width:0;flex:1 1 auto}
  .status .sym{flex:none}
  .status-lines{min-width:0;line-height:1.15}
  #status-text,#status-why{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #status-why{font-size:22px;font-weight:600}
  #status-why:empty{display:none}
  .queue-state{display:flex;align-items:center;gap:12px;font-size:26px;padding:10px 20px;border-radius:999px;background:color-mix(in srgb,var(--ok) 14%,var(--panel));color:var(--ok);white-space:nowrap}
  .queue-state.paused{background:color-mix(in srgb,var(--bad) 14%,var(--panel));color:var(--bad)}
  .queue-state.idle{background:var(--raised);color:var(--dim)}
  .dot{width:14px;height:14px;border-radius:50%;background:currentColor;flex:none;display:inline-block}
  .dot.run{color:var(--run)}
  /* A pulsing dot blinks: wall.js flips .blink once a second, with the
     clock. A CSS animation, even a steps() one, keeps Chrome drawing frames
     all the time, which was most of the wall's CPU on a TV. */
  @media (prefers-reduced-motion: no-preference){
    .blink .pulse{opacity:.3}
  }
  .usage{display:flex;gap:28px;margin-left:auto;flex:none}
  .meter{width:240px}
  .meter .lbl{display:flex;justify-content:space-between;font-size:18px;color:var(--dim);margin-bottom:6px;white-space:nowrap}
  .meter .lbl b{color:var(--text);font-weight:600}
  .meter .lbl .full{color:var(--bad);font-weight:700}
  /* Runners on several Claude accounts: a set of meters per account, under its name (wall.js). */
  .usage.multi{gap:24px;min-width:0;flex:0 1 auto}
  .acct{min-width:0;flex:1 1 0;max-width:420px}
  .acct-name{font-size:15px;color:var(--dim);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .acct.paused .acct-name{color:var(--bad)}
  .acct-meters{display:flex;gap:16px}
  .usage.multi .meter{width:auto;flex:1 1 0;min-width:96px}
  .usage.multi .meter .lbl{font-size:16px;margin-bottom:4px} /* the name above still fits the 96px header */
  .bar{height:12px;border-radius:6px;background:var(--line);position:relative}
  .bar i{display:block;height:100%;border-radius:6px;transition:width .8s ease}
  .clock{font-size:52px;font-weight:600;min-width:170px;text-align:right}

  /* The flow of tasks, one short row: Queued → Running → Review → Merging.
     Tallies (merged, lines, failed) are in Today and Needs a human. */
  .pipeline{display:flex;gap:16px;min-width:0}
  .stages{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;flex:1;min-width:0}
  .stage{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:0 20px 0 24px;position:relative;overflow:hidden;
         display:flex;align-items:center;gap:14px;min-width:0}
  .stage::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c)}
  .stage .k{font-size:17px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase;flex:none}
  .stage .v{font-size:38px;font-weight:700;line-height:1;color:var(--c);flex:none}
  .stage .v.zero{color:var(--faint)}
  .stage .s{font-size:17px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
  .pipeline .queue-state{flex:none;align-self:center;font-size:22px}
  .queue-state[hidden]{display:none}

  /* main */
  main{display:grid;grid-template-columns:1.55fr 1fr 0.8fr;gap:20px;min-height:0}
  .running{display:flex;flex-direction:column;gap:14px}
  .card{border:1px solid var(--line);border-radius:14px;padding:16px 20px;background:var(--raised);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 20px}
  .card .t{font-size:26px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .picon{display:inline-grid;place-items:center;width:30px;height:30px;margin-right:10px;vertical-align:-5px;border-radius:7px;
         font-size:17px;font-weight:700;line-height:1;background:color-mix(in srgb,var(--pc,var(--dim)) 32%,var(--raised))}
  .picon.img{background:none}
  .picon img{width:100%;height:100%;border-radius:inherit;object-fit:cover}
  .card .meta{font-size:20px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .meta span+span::before{content:" · ";color:var(--faint)}
  /* The tool call it is making: small and still, so it doesn't pull the eye. */
  .card .live{grid-column:1/-1;font:400 15px/1.4 "JetBrains Mono",ui-monospace,monospace;color:var(--dim);
              white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .live::before{content:"▸ ";color:var(--faint)}
  .card .live.stuck{color:var(--run);font-weight:600}
  .card .live.stuck::before{content:"⏸ ";color:var(--run)}
  /* Elapsed against the typical time (walllogic.js progress). */
  .prog{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center}
  .pbar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
  .pbar i{display:block;height:100%;background:var(--ok);border-radius:inherit}
  .ptext{font-size:18px;color:var(--dim);white-space:nowrap}
  .prog.over .pbar i{background:var(--run)} .prog.over .ptext{color:var(--run)}
  .prog.late .pbar i{background:var(--bad)} .prog.late .ptext{color:var(--bad);font-weight:600}
  /* Compact rows, when more tasks run than cards fit (wall.js renderRunning). */
  .running.compact{gap:8px}
  .crow{display:grid;grid-template-columns:minmax(0,1fr) 120px auto 90px;gap:16px;align-items:center;padding:8px 16px;border-radius:10px;
        background:var(--raised);border:1px solid var(--line)}
  .crow .t{font-size:21px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .crow .picon{width:24px;height:24px;font-size:14px;margin-right:8px;vertical-align:-4px}
  .crow .ptext{font-size:16px;text-align:right;overflow:hidden;text-overflow:ellipsis}
  .crow .elapsed{font-size:22px;text-align:right}
  .crow.over .pbar i{background:var(--run)} .crow.over .ptext{color:var(--run)}
  .crow.late .pbar i{background:var(--bad)} .crow.late .ptext{color:var(--bad);font-weight:600}
  .card .right{text-align:right;white-space:nowrap}
  .elapsed{font-size:30px;font-weight:600;color:var(--run)}
  .diff{font-size:18px}.add{color:var(--ok)}.del{color:var(--bad)}
  .tag{display:inline-block;font-size:15px;font-weight:600;padding:2px 10px;border-radius:999px;background:color-mix(in srgb,var(--bad) 16%,var(--panel));color:var(--bad);margin-left:8px;vertical-align:middle}
  .more{font-size:18px;color:var(--faint);padding-left:4px}

  .attn{display:flex;flex-direction:column;gap:12px}
  .item{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:16px;align-items:center;padding:14px 16px;border-radius:12px;background:var(--raised);border:1px solid var(--line)}
  .item .bar2{width:10px;height:100%;min-height:52px;border-radius:5px;background:var(--c)}
  .item .t{font-size:22px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .why{font-size:17px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .age{font-size:22px;font-weight:600;color:var(--c);white-space:nowrap;display:flex;align-items:center;gap:10px}
  .item .who{color:var(--text);font-weight:600}
  .item .av{width:34px;height:34px;border-radius:50%;object-fit:cover;flex:none}
  .item .sev{font-size:17px;font-weight:600;color:var(--c);margin-left:10px}
  .item.old{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad) inset}
  .item.old .age{color:var(--bad)}
  .item.old .age::before{content:"⚠"}
  /* Something in Needs a human waits too long: the whole panel says so. */
  .panel.alarm{border-color:var(--bad);box-shadow:0 0 0 2px var(--bad) inset}
  .panel.alarm h2{color:var(--bad)}
  .alarm-note{display:none;letter-spacing:0;text-transform:none;font-size:20px}
  .panel.alarm .alarm-note{display:inline}

  .side{display:grid;grid-template-rows:auto minmax(0,1fr);gap:20px;min-height:0}
  .runner{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
  .runner:last-child{border:0}
  .runner .n{font-size:22px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .runner .h{font-size:16px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .runner .rs{font-size:20px;width:22px;text-align:center;line-height:1}
  .slots{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:140px}
  .slots i{width:18px;height:28px;border-radius:4px;background:var(--line)}
  .slots i.on{background:var(--run)}
  .off{color:var(--bad)}

  .today{display:flex;flex-direction:column}
  .today .big{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px 20px;margin-bottom:14px}
  .today .big div{font-size:16px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
  .today .big b{display:block;font-size:36px;color:var(--text);letter-spacing:0;text-transform:none}
  .today .big .delta{display:block;font-size:15px;color:var(--faint);letter-spacing:0;text-transform:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* Lines landed: the net change, with the lines added and removed stacked
     small beside it, within the number's line so the tile keeps its height. */
  .today .big b.lines{display:flex;align-items:center;gap:8px;height:1.3em;min-width:0}
  .today .net{flex:none;white-space:nowrap}
  .today .net.long{font-size:28px}
  .today .net.longer{font-size:23px}
  .today .net.add{color:var(--ok)}
  .today .net.cut{color:var(--rev)}
  .today .split{display:flex;flex-direction:column;font-size:14px;font-weight:500;line-height:1.2;color:var(--dim);min-width:0;overflow:hidden}
  .today .split span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  /* Just landed: the newest merges. */
  .landed{display:flex;flex-direction:column;gap:6px;min-height:0;overflow:hidden;position:relative}
  .land{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:baseline;font-size:19px}
  .land .ck{color:var(--ok);font-weight:700}
  .land .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .land .p{color:var(--faint)}
  .land .at{color:var(--dim)}

  /* Motion (wall.js "motion"): each animation is short and runs once, when
     the data changes, so a quiet wall draws no frames at all. */
  .running,.attn,#runners,.landed{position:relative}
  .card,.item{--hl:var(--c,var(--run))}
  .queue-state{transition:background-color .6s ease,color .6s ease}
  .ghost{position:absolute;margin:0;z-index:1;pointer-events:none}
  .ghost.ok{--hl:var(--ok)}
  .ghost.bad{--hl:var(--bad)}
  .outcome{position:absolute;right:20px;top:50%;translate:0 -50%;padding:6px 18px;border-radius:999px;font-size:22px;font-weight:600;white-space:nowrap;
           color:var(--hl);background:color-mix(in srgb,var(--hl) 16%,var(--raised));box-shadow:0 0 0 1px color-mix(in srgb,var(--hl) 45%,transparent)}
  @media (prefers-reduced-motion: no-preference){
    .appear{animation:wall-in .6s cubic-bezier(.2,.7,.2,1) var(--d,0s) backwards}
    .enter{outline:2px solid transparent;outline-offset:-1px;
           animation:wall-in .6s cubic-bezier(.2,.7,.2,1) var(--d,0s) backwards,wall-glow 2.2s ease-out var(--d,0s) backwards}
    .ghost{animation:wall-out .35s cubic-bezier(.3,0,.2,1) forwards}
    .ghost.held{animation:wall-tint .35s ease-out forwards,wall-out .35s cubic-bezier(.3,0,.2,1) .9s forwards}
    .ghost.held .right{animation:wall-fade .3s ease-out reverse forwards}
    .outcome{animation:wall-badge .45s cubic-bezier(.2,.9,.3,1.2) .1s backwards}
    .roll-up{animation:wall-up .55s cubic-bezier(.2,.7,.2,1)}
    .roll-down{animation:wall-down .55s cubic-bezier(.2,.7,.2,1)}
    .stage.bump{animation:wall-flash 1.8s ease-out}
    .fresh{animation:wall-fade .7s ease-out}
    .slots i.pop{animation:wall-pop .5s cubic-bezier(.3,1.5,.5,1)}
    .slots i.drop{animation:wall-drop 1s ease-out}
  }
  @keyframes wall-in{from{opacity:0;transform:translateY(14px) scale(.98)}}
  @keyframes wall-glow{0%,25%{outline-color:color-mix(in srgb,var(--hl) 80%,transparent)}}
  @keyframes wall-out{to{opacity:0;transform:translateX(28px) scale(.97)}}
  @keyframes wall-tint{to{border-color:var(--hl);background:color-mix(in srgb,var(--hl) 10%,var(--raised))}}
  @keyframes wall-badge{from{opacity:0;scale:.8}}
  @keyframes wall-up{from{opacity:0;transform:translateY(.35em)}}
  @keyframes wall-down{from{opacity:0;transform:translateY(-.35em)}}
  @keyframes wall-flash{from{background:color-mix(in srgb,var(--c) 22%,var(--panel))}}
  @keyframes wall-fade{from{opacity:0}}
  @keyframes wall-pop{from{transform:scale(.2);opacity:0}}
  @keyframes wall-drop{from{background:var(--run)}}

  /* Stale data (wall.js "stale"): the board greys out and stops its timers,
     and a notice over it says how old it is. */
  .stale{position:absolute;left:50%;top:50%;translate:-50% -50%;z-index:4;display:none;padding:28px 48px;border-radius:24px;
         font-size:52px;font-weight:700;color:var(--text);background:color-mix(in srgb,var(--bg) 85%,transparent);
         box-shadow:0 0 0 3px var(--bad);white-space:nowrap}
  .stale::before{content:"⚠ ";color:var(--bad)}
  html.is-stale .stale{display:block}
  html.is-stale .tv > :not(.stale):not(.error){filter:grayscale(1) brightness(.45)}
  html.is-stale .tv::after{border-color:var(--faint);border-width:4px}
  /* Off hours with nothing to show (wall.js "off hours"): a dim summary
     of the week instead of empty panels. */
  .offhours{position:absolute;inset:0;z-index:2;display:none;flex-direction:column;align-items:center;justify-content:center;gap:28px;
            background:var(--bg);color:var(--dim);text-align:center;padding:40px}
  .offhours .wk{font-size:64px;font-weight:700;color:var(--text);opacity:.7}
  .offhours .st{font-size:36px;font-weight:600;color:var(--st);opacity:.8}
  .offhours .ck{font-size:30px;opacity:.6}
  html.off .offhours{display:flex}
  html.off .tv > :not(.offhours):not(.stale):not(.error){visibility:hidden}
  html.off .tv::after{border-width:2px;opacity:.5}
  .error{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:36px;color:var(--dim);background:var(--bg)}
  .error.on{display:flex}

  /* Narrow or portrait screens (a laptop window, a portrait TV, a phone):
     everything stacks into one column and the page scrolls instead of
     shrinking a 1920-wide canvas to an unreadable size. wall.js sets the
     classes and the canvas width. */
  html.narrow,html.narrow body{overflow-x:hidden;overflow-y:auto;cursor:auto}
  html.narrow body{height:auto}
  .narrow .tv{height:auto;grid-template-rows:auto;overflow:visible}
  .narrow header{flex-wrap:wrap;gap:16px 28px}
  .narrow .brand{order:-2;flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
  .narrow .clock{order:-1;min-width:0}
  .narrow .status{order:-1;flex:1 1 100%;font-size:32px}
  .narrow #status-text,.narrow #status-why{white-space:normal}
  .narrow .usage{margin-left:0}
  .narrow .pipeline{flex-wrap:wrap}
  .narrow .stages{flex:1 1 100%}
  .narrow .stage{padding:12px 16px 12px 22px}
  .narrow .stale{font-size:36px;white-space:normal;width:90%;text-align:center;top:24px;translate:-50% 0}
  .narrow .offhours .wk{font-size:44px}
  .narrow .crow{grid-template-columns:minmax(0,1fr) 120px 100px;}
  .narrow .crow .ptext{display:none}
  .narrow main{grid-template-columns:minmax(0,1fr)}
  .narrow .side{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto}
  .narrow .spark{flex:none;height:120px}
  .phone header{gap:12px 20px}
  .phone .queue-state{font-size:22px;padding:8px 16px}
  .phone .usage{width:100%;gap:20px}
  .phone .meter{flex:1;width:auto}
  .narrow .usage.multi{flex-wrap:wrap;flex:1 1 100%}
  .phone .acct{flex-basis:100%;max-width:none}
  .phone .stages{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
  .phone .stage{flex-wrap:wrap;gap:4px 12px}
  .phone .stage .s{flex:1 1 100%}
  .phone .status{font-size:28px}
  .phone .side{grid-template-columns:minmax(0,1fr)}
</style>
</head>
<body>
<div class="tv" id="tv">
  <header>
    <div class="brand">{{DASH_NAME}}<small id="scope"></small></div>
    <div class="status" id="status" role="status"><span class="sym" id="status-sym" aria-hidden="true"></span>
      <div class="status-lines"><div id="status-text">Loading…</div><div id="status-why"></div></div></div>
    <div class="usage" id="usage"></div>
    <div class="clock num" id="clock"></div>
  </header>

  <section class="pipeline" aria-label="Tasks by lane">
    <div class="stages" id="pipeline"></div>
    <div class="queue-state" id="queue" hidden><span class="dot"></span><span id="queue-text"></span></div>
  </section>

  <main>
    <section class="panel">
      <h2><span class="dot run" id="running-dot"></span>Running now</h2>
      <div class="running" id="running"></div>
    </section>
    <section class="panel" id="needs-panel">
      <h2>Needs a human <span class="count num" id="needs-count"></span><span class="alarm-note">⚠ waiting too long</span></h2>
      <div class="attn" id="needs"></div>
    </section>
    <section class="side">
      <div class="panel">
        <h2>Runners <span class="count num" id="runners-count"></span></h2>
        <div id="runners"></div>
      </div>
      <div class="panel today">
        <h2>Today</h2>
        <div class="big" id="today"></div>
        <h2 class="sub">Just landed</h2>
        <div class="landed" id="landed"></div>
      </div>
    </section>
  </main>

  <div class="offhours" id="offhours"><div class="wk" id="off-week"></div><div class="st" id="off-status"></div><div class="ck num" id="off-clock"></div></div>
  <div class="stale" id="stale" role="alert"></div>
  <div class="error" id="error"></div>
</div>
<script src="/pagekit.js"></script>
<script src="/wall.js" type="module"></script>
</body>
</html>
