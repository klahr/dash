<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>{{DASH_NAME}} · Wall</title>
<link rel="icon" href="/favicon.svg">
<link rel="stylesheet" href="/vendor/fonts/fonts.css">
<style>
  :root{
    /* Same palette as the app (style.css :root), under the wall's short names. */
    color-scheme:dark;
    --bg:#101722; --panel:#172131; --raised:#1f2b3e; --line:#2a384d; --text:#e6ecf5; --dim:#8a9ab2; --faint:#8393ac;
    --queue:#8aa4ff; --run:#f2b84b; --rev:#5ec8e5; --ok:#6fd39a; --bad:#ff7a7a; --merge:#c79bff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);overflow:hidden;height:100%;cursor:none}
  .tv{width:1920px;height:1080px;background:var(--bg);color:var(--text);position:absolute;left:0;top:0;transform-origin:0 0;
      font:500 22px/1.3 "Instrument Sans","Inter","Segoe UI",system-ui,sans-serif;
      display:grid;grid-template-rows:96px 150px minmax(0,1fr) 64px;gap:20px;padding:28px 36px;overflow:hidden}
  .num{font-variant-numeric:tabular-nums}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px 26px;min-height:0;overflow:hidden}
  h2{font-size:20px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-bottom:16px;display:flex;align-items:center;gap:12px}
  h2 .count{color:var(--text);letter-spacing:0;font-size:22px}
  .empty{color:var(--faint);font-size:22px;padding:8px 0}

  /* header */
  header{display:flex;align-items:center;gap:36px;min-width:0}
  .brand{font-size:40px;font-weight:700;letter-spacing:-.02em;white-space:nowrap}
  .brand small{font-size:22px;color:var(--dim);font-weight:500;margin-left:14px}
  .queue-state{display:flex;align-items:center;gap:12px;font-size:26px;padding:10px 20px;border-radius:999px;background:color-mix(in srgb,var(--ok) 14%,var(--panel));color:var(--ok);white-space:nowrap}
  .queue-state.paused{background:color-mix(in srgb,var(--bad) 14%,var(--panel));color:var(--bad)}
  .queue-state.idle{background:var(--raised);color:var(--dim)}
  .dot{width:14px;height:14px;border-radius:50%;background:currentColor;flex:none;display:inline-block}
  .pulse{animation:pulse 1.6s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.3}}
  .usage{display:flex;gap:28px;margin-left:auto}
  .meter{width:240px}
  .meter .lbl{display:flex;justify-content:space-between;font-size:18px;color:var(--dim);margin-bottom:6px;white-space:nowrap}
  .meter .lbl b{color:var(--text);font-weight:600}
  .bar{height:12px;border-radius:6px;background:var(--line);position:relative}
  .bar i{display:block;height:100%;border-radius:6px;transition:width .8s ease}
  .bar .mark{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--bad);border-radius:2px;opacity:.9}
  .clock{font-size:52px;font-weight:600;min-width:170px;text-align:right}

  /* pipeline */
  .pipeline{display:grid;grid-template-columns:repeat(6,1fr);gap:16px}
  .stage{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px 24px;position:relative;overflow:hidden}
  .stage::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--c)}
  .stage .k{font-size:18px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase}
  .stage .v{font-size:72px;font-weight:700;line-height:1.05;color:var(--c)}
  .stage .v.zero{opacity:.35}
  .stage .s{font-size:18px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* main */
  main{display:grid;grid-template-columns:1.55fr 1fr 0.8fr;gap:20px;min-height:0}
  .running{display:flex;flex-direction:column;gap:14px}
  .card{border:1px solid var(--line);border-radius:14px;padding:16px 20px;background:var(--raised);display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 20px}
  .card .t{font-size:26px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .meta{font-size:18px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .card .meta span+span::before{content:" · ";color:var(--faint)}
  .card .live{grid-column:1/-1;font:400 18px/1.4 "JetBrains Mono",ui-monospace,monospace;color:var(--text);
              white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.85}
  .card .live::before{content:"▸ ";color:var(--run)}
  .card .right{text-align:right;white-space:nowrap}
  .elapsed{font-size:30px;font-weight:600;color:var(--run)}
  .diff{font-size:18px}.add{color:var(--ok)}.del{color:var(--bad)}
  .tag{display:inline-block;font-size:15px;font-weight:600;padding:2px 10px;border-radius:999px;background:color-mix(in srgb,var(--bad) 16%,var(--panel));color:var(--bad);margin-left:8px;vertical-align:middle}
  .more{font-size:18px;color:var(--faint);padding-left:4px}

  .attn{display:flex;flex-direction:column;gap:12px}
  .item{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:16px;align-items:center;padding:14px 16px;border-radius:12px;background:var(--raised);border:1px solid var(--line)}
  .item .bar2{width:10px;height:100%;min-height:52px;border-radius:5px;background:var(--c)}
  .item .t{font-size:22px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .why{font-size:17px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .age{font-size:22px;font-weight:600;color:var(--c);white-space:nowrap}
  .item.old{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad) inset}

  .side{display:grid;grid-template-rows:auto minmax(0,1fr);gap:20px;min-height:0}
  .runner{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
  .runner:last-child{border:0}
  .runner .n{font-size:22px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .runner .h{font-size:16px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .slots{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:140px}
  .slots i{width:18px;height:28px;border-radius:4px;background:var(--line)}
  .slots i.on{background:var(--run)}
  .off{color:var(--bad)}

  .today{display:flex;flex-direction:column}
  .today .big{display:grid;grid-template-columns:1fr 1fr;gap:10px 20px;margin-bottom:14px}
  .today .big div{font-size:16px;color:var(--dim);text-transform:uppercase;letter-spacing:.08em}
  .today .big b{display:block;font-size:36px;color:var(--text);letter-spacing:0;text-transform:none}
  .spark{width:100%;flex:1;min-height:40px;display:block}
  .axis{display:flex;justify-content:space-between;font-size:15px;color:var(--faint)}

  /* ticker */
  footer{display:flex;align-items:center;gap:20px;overflow:hidden;border-top:1px solid var(--line);padding-top:14px}
  footer .lbl{font-size:16px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);flex:none}
  .tickwrap{overflow:hidden;flex:1;min-width:0}
  .ticker{display:inline-flex;gap:56px;white-space:nowrap;font-size:20px;color:var(--dim);will-change:transform}
  .ticker.scroll{animation:scroll var(--dur,60s) linear infinite}
  .ticker b{color:var(--text);font-weight:600}
  .ticker .k-merged{color:var(--ok)} .ticker .k-started{color:var(--run)} .ticker .k-sent_back{color:var(--bad)}
  .ticker .k-ci,.ticker .k-failed,.ticker .k-offline{color:var(--bad)} .ticker .k-review{color:var(--rev)}
  @keyframes scroll{to{transform:translateX(-50%)}}
  /* WCAG 2.2.2: hovering or focusing the ticker pauses it so an item can be read. */
  .tickwrap:hover .ticker,.tickwrap:focus-within .ticker{animation-play-state:paused}
  .tickwrap:focus-visible{outline:2px solid var(--text);outline-offset:4px}
  @media (prefers-reduced-motion: reduce){
    .ticker.scroll,.pulse{animation:none}
    .tickwrap{overflow-x:auto}
  }

  .stale{position:absolute;right:36px;bottom:8px;font-size:15px;color:var(--bad);display:none}
  .stale.on{display:block}
  .error{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:36px;color:var(--dim);background:var(--bg)}
  .error.on{display:flex}

  /* Narrow or portrait screens (a laptop window, a portrait TV, a phone):
     everything stacks into one column and the page scrolls instead of
     shrinking a 1920-wide canvas to an unreadable size. wall.js sets the
     classes and the canvas width. */
  html.narrow,html.narrow body{overflow-x:hidden;overflow-y:auto;cursor:auto}
  html.narrow body{height:auto}
  .narrow .tv{height:auto;grid-template-rows:auto;overflow:visible}
  .narrow header{flex-wrap:wrap;gap:16px 28px}
  .narrow .brand{order:-2;flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
  .narrow .clock{order:-1;min-width:0}
  .narrow .usage{margin-left:0}
  .narrow .pipeline{grid-template-columns:repeat(3,1fr)}
  .narrow main{grid-template-columns:minmax(0,1fr)}
  .narrow .side{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto}
  .narrow .spark{flex:none;height:120px}
  .phone header{gap:12px 20px}
  .phone .queue-state{font-size:22px;padding:8px 16px}
  .phone .usage{width:100%;gap:20px}
  .phone .meter{flex:1;width:auto}
  .phone .pipeline{grid-template-columns:repeat(2,1fr);gap:12px}
  .phone .stage .v{font-size:60px}
  .phone .side{grid-template-columns:minmax(0,1fr)}
</style>
</head>
<body>
<div class="tv" id="tv">
  <header>
    <div class="brand">{{DASH_NAME}}<small id="scope"></small></div>
    <div class="queue-state idle" id="queue"><span class="dot"></span><span id="queue-text">Loading…</span></div>
    <div class="usage" id="usage"></div>
    <div class="clock num" id="clock"></div>
  </header>

  <section class="pipeline" id="pipeline"></section>

  <main>
    <section class="panel">
      <h2><span class="dot pulse" style="color:var(--run)"></span>Running now <span class="count num" id="running-count"></span></h2>
      <div class="running" id="running"></div>
    </section>
    <section class="panel">
      <h2>Needs a human <span class="count num" id="needs-count"></span></h2>
      <div class="attn" id="needs"></div>
    </section>
    <section class="side">
      <div class="panel">
        <h2>Runners <span class="count num" id="runners-count"></span></h2>
        <div id="runners"></div>
      </div>
      <div class="panel today">
        <h2>Today</h2>
        <div class="big" id="today"></div>
        <h2 style="margin:0 0 6px">Merged per hour</h2>
        <svg class="spark" id="spark" viewBox="0 0 300 110" preserveAspectRatio="none"></svg>
        <div class="axis"><span id="spark-from"></span><span>now</span></div>
      </div>
    </section>
  </main>

  <footer>
    <span class="lbl">Latest</span>
    <div class="tickwrap" tabindex="0" role="region" aria-label="Latest events (hover or focus to pause)"><div class="ticker" id="ticker"></div></div>
  </footer>
  <div class="stale" id="stale">connection lost · retrying</div>
  <div class="error" id="error"></div>
</div>
<script src="/wall.js"></script>
</body>
</html>
