<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<title>{{.Title}} · {{.Name}}</title>
<style>
:root{--bg:#fff;--text:#1b2230;--muted:#5b6678;--line:#dfe4ec;--accent:#3557d6;--ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#0d131d;--text:#e8edf5;--muted:#8e9db3;--line:#243246;--accent:#8aa4ff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.65 var(--ui);-webkit-text-size-adjust:100%}
.wrap{width:min(760px,100%);margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 20px 32px}
header{border-bottom:1px solid var(--line);margin-bottom:24px}
.brand{display:inline-flex;align-items:center;gap:10px;padding:8px 0 14px;font-weight:700;font-size:18px;color:var(--text);text-decoration:none}
.brand img{width:28px;height:28px;border-radius:7px}
a{color:var(--accent)}
h1{font-size:30px;line-height:1.25;margin:0 0 16px}
h2{font-size:21px;margin:32px 0 8px}
h3{font-size:17px;margin:24px 0 6px}
table{border-collapse:collapse;width:100%;display:block;overflow-x:auto;font-size:15px}
th,td{border:1px solid var(--line);padding:6px 10px;text-align:left;vertical-align:top}
code{font-size:.9em}
.site-footer{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:14px}
.site-footer a{color:inherit}
</style>
</head>
<body>
<div class="wrap">
<header><a class="brand" href="/"><img src="{{.Logo}}" alt=""><span>{{.Name}}</span></a></header>
<main>
{{.Body}}
</main>
{{.Footer}}
</div>
</body>
</html>
