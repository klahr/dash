# Release builds of Dash: run by .github/workflows/release.yml on an X.Y.Z tag
# (e.g. 1.2.0, or 1.2.0-rc.1 for a prerelease).
# Check locally with `goreleaser check`; try a build with
# `goreleaser release --snapshot --clean` (output in dist/).
version: 2

project_name: dash

builds:
  - &build
    id: dash
    main: ./cmd/dash
    binary: dash
    env:
      - CGO_ENABLED=0 # the SQLite driver is pure Go
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    flags: [-trimpath]
    ldflags:
      - -s -w -X github.com/klahr/dash/internal/buildinfo.Version={{ .Tag }}
    mod_timestamp: "{{ .CommitTimestamp }}"
  - <<: *build
    id: dash-tui
    main: ./cmd/dash-tui
    binary: dash-tui
  - <<: *build
    id: dash-mcp
    main: ./cmd/dash-mcp
    binary: dash-mcp

archives:
  - formats: [tar.gz]
    # dash_1.2.0_linux_amd64.tar.gz; dash_1.2.0_windows_amd64.zip (with
    # dash.exe: runnerctl.Asset and install.ps1.tmpl expect these names)
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md
      - .env.example
      - deploy/dash.service
      # A VPS behind Caddy (docs/deploy.md#a-vps-behind-caddy).
      - deploy/Caddyfile
      # Run the hub with Docker (docs/deploy.md#run-the-hub-with-docker).
      - deploy/docker-compose.yml
      - deploy/docker-compose.dns.yml
      - deploy/docker.env.example
      - deploy/caddy/*
      # Terms of service and privacy policy to fill in (docs/privacy.md).
      - deploy/legal/*

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  use: github
  sort: asc

release:
  github:
    owner: klahr
    name: dash
  prerelease: auto # a tag with a suffix, e.g. 1.2.0-rc.1

# The hub's container image (docs/deploy.md#run-the-hub-with-docker), for
# linux/amd64 and linux/arm64, from the same release binaries, so it reports
# the same `dash version`. Pushed to ghcr.io/<owner>/dash, <owner> being the
# GitHub account the release runs under (set by Actions; "local" elsewhere).
# A snapshot build (`goreleaser release --snapshot`) only builds it.
dockers_v2:
  - id: dash
    ids: [dash]
    dockerfile: deploy/Dockerfile.release
    images:
      - 'ghcr.io/{{ tolower (envOrDefault "GITHUB_REPOSITORY_OWNER" "local") }}/dash'
    tags:
      - "{{ .Version }}" # 1.2.0 for tag 1.2.0 (or v1.2.0)
      - "{{ if not .Prerelease }}latest{{ end }}" # not for 1.2.0-rc.1
    platforms: [linux/amd64, linux/arm64]
    labels:
      org.opencontainers.image.title: dash
      org.opencontainers.image.description: "The Dash hub (runners install natively)"
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .Date }}"
      org.opencontainers.image.source: "{{ .GitURL }}"
